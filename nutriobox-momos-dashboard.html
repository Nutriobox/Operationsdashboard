  const out=[]; for(let i=0;i<NWK;i++){ if(wkEnd(i)>=s && wkStart(i)<=e) out.push(i); } return out; }
function fmtD(d){ return d.getDate()+" "+MON[d.getMonth()]; }
function rangeLabel(idxs){ if(!idxs||!idxs.length) return "No data";
  if(idxs.length===NWK) return fmtD(DATA_START)+" – "+fmtD(DATA_END);
  return fmtD(wkStart(idxs[0]))+" – "+fmtD(wkEnd(idxs[idxs.length-1])); }

// ---- aggregations over a set of week indices ----
function sumCols(mat,W){ const n=D.outletNames.length, out=new Array(n).fill(0);
  W.forEach(w=>{ const r=mat[w]; for(let i=0;i<n;i++) out[i]+=r[i]; }); return out; }
function outletAgg(W,m){ const S=m==="units"?D.oUnits:D.oSales, Vg=m==="units"?D.oVegUnits:D.oVegSales, Nn=m==="units"?D.oNonUnits:D.oNonSales;
  const s=sumCols(S,W), vg=sumCols(Vg,W), nn=sumCols(Nn,W);
  return D.outletNames.map((nm,i)=>({name:nm,val:s[i],veg:vg[i],non:nn[i]})); }
function vnAgg(W,m){ const Vg=m==="units"?D.oVegUnits:D.oVegSales, Nn=m==="units"?D.oNonUnits:D.oNonSales;
  const vg=sum(sumCols(Vg,W)), nn=sum(sumCols(Nn,W)); return {veg:vg,non:nn,total:vg+nn}; }
function variantMixAgg(W){ return D.variants.map(v=>{ let vs=0,ns=0; W.forEach(w=>{vs+=D.vVegSales[v][w]; ns+=D.vNonSales[v][w];}); return {v,veg:vs,non:ns,tot:vs+ns}; }); }
function outletTableAgg(W){ const vs=sumCols(D.oVegSales,W), ns=sumCols(D.oNonSales,W), s=sumCols(D.oSales,W), u=sumCols(D.oUnits,W);
  return D.outletNames.map((nm,i)=>({name:nm,veg:vs[i],non:ns[i],tot:s[i],units:u[i]})); }
// per-week cell for variant tables
function vCell(side,v,w,m){ if(side==="veg"){ return m==="units"?D.vVegUnits[v][w]:D.vVegSales[v][w]; } return m==="units"?D.vNonUnits[v][w]:D.vNonSales[v][w]; }

// persisted UI state (survive re-render)
let selOutlet=ALLWK.slice(), selVN=ALLWK.slice(), selVM=ALLWK.slice(), selOtbl=ALLWK.slice();
let mOutlet="sales", mVN="sales", mNV="sales", mV="sales";

// ---------- chart (weekly trend, with axis titles + hover tooltips) ----------
function trendSVG(){
  const salesMax=Math.max(...D.weekly.sales), unitsMax=Math.max(...D.weekly.units);
  const GN=5, salesTop=Math.ceil((salesMax*1.08)/500000)*500000, unitsTop=Math.ceil(unitsMax/500)*500;
  const R0=702,L0=58,T0=26,B0=244,PW=760,PH=300;
  const band=(R0-L0)/D.weekLabels.length, barW=Math.min(38,band*0.42);
  const yS=v=>B0-(v/salesTop)*(B0-T0), yU=v=>B0-(v/unitsTop)*(B0-T0), cx=i=>L0+band*i+band/2;
  let g="";
  for(let k=0;k<=GN;k++){ const gy=B0-(k/GN)*(B0-T0);
    g+=`<line x1="${L0}" y1="${gy}" x2="${R0}" y2="${gy}" stroke="${k===0?'#cbd5e1':'#eef1f7'}"/>`
      +`<text x="${L0-9}" y="${gy+3.5}" text-anchor="end" class="axl">₹${salesTop*k/GN/100000}L</text>`
      +`<text x="${R0+9}" y="${gy+3.5}" text-anchor="start" class="axr">${num(unitsTop*k/GN)}</text>`; }
  let bars="";
  D.weekLabels.forEach((lab,i)=>{ const yv=yS(D.weekly.sales[i]), labY=Math.min(yv,yU(D.weekly.units[i]))-11;
    bars+=`<rect x="${cx(i)-barW/2}" y="${yv}" width="${barW}" height="${B0-yv}" rx="4" fill="${i===LAST?HL:ACCENT}"/>`
       +`<text x="${cx(i)}" y="${labY}" text-anchor="middle" class="blab">${lak(D.weekly.sales[i])}</text>`
       +`<text x="${cx(i)}" y="${B0+20}" text-anchor="middle" class="xlab">${lab}</text>`
       +`<text x="${cx(i)}" y="${B0+35}" text-anchor="middle" class="xsub">${esc(D.weekSpans[i])}</text>`; });
  const pts=D.weekly.units.map((u,i)=>`${cx(i)},${yU(u)}`).join(" ");
  let dots=""; D.weekly.units.forEach((u,i)=>{ dots+=`<circle cx="${cx(i)}" cy="${yU(u)}" r="${i===LAST?5:3.5}" fill="${LINE}" stroke="#fff" stroke-width="1.5"/>`; });
  const midY=(T0+B0)/2;
  const titles=`<text x="16" y="${midY}" text-anchor="middle" transform="rotate(-90 16 ${midY})" class="axttlL">Sales (₹)</text>`
    +`<text x="${R0+40}" y="${midY}" text-anchor="middle" transform="rotate(90 ${R0+40} ${midY})" class="axttlR">Units sold</text>`;
  let hit=""; D.weekLabels.forEach((lab,i)=>{ hit+=`<rect class="hit" x="${L0+band*i}" y="${T0}" width="${band}" height="${B0-T0}" fill="transparent" data-i="${i}"/>`; });
  return `<svg viewBox="0 0 ${PW} ${PH}" width="100%" role="img" style="display:block">${g}${titles}${bars}`
    +`<polyline points="${pts}" fill="none" stroke="${LINE}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${hit}</svg>`;
}

// ---------- filterable card bodies ----------
function outletBars(W,m){
  const rows=outletAgg(W,m).slice().sort((a,b)=>b.val-a.val);
  const oMax=Math.max(...rows.map(r=>r.val),1);
  return rows.map(r=>{ const base=r.val||1;
    return `<div class="brow"><div class="bname">${esc(r.name)}</div>`
    +`<div class="btrack"><div class="bfill" style="width:${r.val/oMax*100}%">`
    +`<div style="width:${r.veg/base*100}%;background:${VEG}"></div>`
    +`<div style="width:${r.non/base*100}%;background:${NONVEG}"></div></div></div>`
    +`<div class="bval">${fmtVal(r.val,m)}</div></div>`; }).join("");
}
function donut(W,m){
  const a=vnAgg(W,m), total=a.total||1, vegPct=a.veg/total*100, DC=2*Math.PI*64, vegLen=a.veg/total*DC;
  const centerBig=m==="units"?num(a.total):lak(a.total), centerSub=m==="units"?"momo units":"momo sales";
  return `<svg viewBox="0 0 180 180" width="176" height="176" role="img" style="display:block;margin:6px auto 2px">`
    +`<g transform="rotate(-90 90 90)"><circle cx="90" cy="90" r="64" fill="none" stroke="#eef2f6" stroke-width="24"/>`
    +`<circle cx="90" cy="90" r="64" fill="none" stroke="${VEG}" stroke-width="24" stroke-dasharray="${vegLen} ${DC-vegLen}"/>`
    +`<circle cx="90" cy="90" r="64" fill="none" stroke="${NONVEG}" stroke-width="24" stroke-dasharray="${DC-vegLen} ${vegLen}" stroke-dashoffset="${-vegLen}"/></g>`
    +`<text x="90" y="86" text-anchor="middle" class="donutBig">${centerBig}</text>`
    +`<text x="90" y="105" text-anchor="middle" class="donutSub">${centerSub}</text></svg>`
    +`<div class="vnrow"><span><i style="background:${VEG}"></i>Veg</span><b>${fmtVal(a.veg,m)} · ${vegPct.toFixed(1)}%</b></div>`
    +`<div class="vnrow"><span><i style="background:${NONVEG}"></i>Non-veg</span><b>${fmtVal(a.non,m)} · ${(100-vegPct).toFixed(1)}%</b></div>`;
}
function variantMix(W){
  const rows=variantMixAgg(W), varMax=Math.max(...rows.map(r=>r.tot),1);
  return rows.map(r=>{ const t=r.tot||0, base=t||1;
    return `<div class="brow"><div class="bname" style="width:92px">${esc(r.v)}</div>`
      +`<div class="btrack"><div class="bfill" style="width:${t/varMax*100}%">`
      +`<div style="width:${r.veg/base*100}%;background:${VEG}"></div>`
      +`<div style="width:${r.non/base*100}%;background:${NONVEG}"></div></div></div>`
      +`<div class="bval">${lak(t)}</div></div>`; }).join("");
}
function variantTableBody(side,m){
  const fmt=m==="units"?num:inr;
  const colTot=D.weekLabels.map((_,w)=>D.variants.reduce((s,v)=>s+vCell(side,v,w,m),0));
  const head=`<tr><th>Variant</th>${D.weekLabels.map((w,i)=>`<th class="${i===LAST?'wk5':''}">${w}</th>`).join("")}<th>Total</th></tr>`;
  const rows=D.variants.map(v=>{ const cells=D.weekLabels.map((_,w)=>vCell(side,v,w,m)); const tot=sum(cells);
    return `<tr><td>${esc(v)}</td>${cells.map((x,i)=>`<td class="${i===LAST?'wk5':''}">${fmt(x)}</td>`).join("")}<td>${fmt(tot)}</td></tr>`; }).join("");
  const tot=`<tr class="tot"><td>Total</td>${colTot.map((x,i)=>`<td class="${i===LAST?'wk5':''}">${fmt(x)}</td>`).join("")}<td>${fmt(sum(colTot))}</td></tr>`;
  return `<thead>${head}</thead><tbody>${rows}${tot}</tbody>`;
}
function outletTableBody(W){
  const rows=outletTableAgg(W).slice().sort((a,b)=>b.tot-a.tot);
  const body=rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${inr(r.veg)}</td><td>${inr(r.non)}</td><td><b>${inr(r.tot)}</b></td><td>${num(r.units)}</td></tr>`).join("");
  const tv=sum(rows.map(r=>r.veg)), tn=sum(rows.map(r=>r.non)), ts=sum(rows.map(r=>r.tot)), tu=sum(rows.map(r=>r.units));
  const tot=`<tr class="tot"><td>Total</td><td>${inr(tv)}</td><td>${inr(tn)}</td><td>${inr(ts)}</td><td>${num(tu)}</td></tr>`;
  return `<thead><tr><th>Outlet</th><th>Veg ₹</th><th>Non-veg ₹</th><th>Total ₹</th><th>Units</th></tr></thead><tbody>${body}${tot}</tbody>`;
}

function toggleHTML(scope,cur){ return `<div class="toggle" data-scope="${scope}"><button data-m="sales" class="${cur==='sales'?'on':''}">₹ Sales</button><button data-m="units" class="${cur==='units'?'on':''}">Units</button></div>`; }
function calBadge(key,sel){ return `<button class="calbadge" id="calbtn-${key}"><span class="calico">📅</span><span id="callabel-${key}">${rangeLabel(sel)}</span></button>`; }

// ---------- date-range calendar (independent per card; opens with nothing selected) ----------
function setupCal(key, getSel, applyCb){
  const btn=document.getElementById("calbtn-"+key); if(!btn) return;
  const host=btn.parentNode; host.style.position="relative";
  let pop=null, ss=null, se=null, hov=null, leftM=new Date(DATA_END.getFullYear(),DATA_END.getMonth()-1,1), ct=null;
  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const parse=s=>{ const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); };
  const inData=t=>t>=dOnly(DATA_START).getTime()&&t<=dOnly(DATA_END).getTime();
  function monthHTML(base){
    const y=base.getFullYear(), m=base.getMonth();
    const startDow=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
    const effEnd=se||hov, a=ss?dOnly(ss).getTime():null, b=effEnd?dOnly(effEnd).getTime():a;
    const lo=a!=null?Math.min(a,b):null, hi=a!=null?Math.max(a,b):null;
    let cells=""; for(let i=0;i<startDow;i++) cells+='<div class="cd empty"></div>';
    for(let d=1;d<=dim;d++){ const dt=new Date(y,m,d), t=dt.getTime(); let cls="cd "+(inData(t)?"hasdata":"nodata");
      if(a!=null && t>=lo && t<=hi) cls+=" inr";
      if(a!=null && (t===a||t===b)) cls+=" endp";
      cells+=`<div class="${cls}" data-date="${iso(dt)}">${d}</div>`; }
    return `<div class="calmonth"><div class="calmh">${MON[m]} ${y}</div><div class="calgrid">`
      +`<div class="cdow">Su</div><div class="cdow">Mo</div><div class="cdow">Tu</div><div class="cdow">We</div><div class="cdow">Th</div><div class="cdow">Fr</div><div class="cdow">Sa</div>`
      +cells+`</div></div>`;
  }
  function footText(){ const f=d=>String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
    const effEnd=se||hov; if(!ss) return "Pick a start date"; return f(ss)+(effEnd?" – "+f(effEnd):" – …"); }
  function draw(){ const rM=new Date(leftM.getFullYear(),leftM.getMonth()+1,1);
    pop.innerHTML=`<div class="calpresets">`
      +`<button data-preset="all">Full period</button><button data-preset="today">Today</button>`
      +`<button data-preset="yst">Yesterday</button><button data-preset="l7">Last 7 Days</button>`
      +`<button data-preset="l30">Last 30 Days</button><button data-preset="tm">This Month</button>`
      +`<button data-preset="lm">Last Month</button></div>`
      +`<div class="calmain"><div class="calnav"><button data-nav="prev">‹</button><button data-nav="next">›</button></div>`
      +`<div class="calmonths">${monthHTML(leftM)}${monthHTML(rM)}</div>`
      +`<div class="calnote">Single-click a start date, hover to preview, double-click the end date. Snaps to whole weeks.</div>`
      +`<div class="calfoot"><span class="calrng">${footText()}</span><span class="cbtns"><button data-act="cancel">Cancel</button><button class="apply" data-act="apply">Apply</button></span></div></div>`;
  }
  function setPreset(p){ const now=dOnly(new Date());
    if(p==="all"){ ss=dOnly(DATA_START); se=dOnly(DATA_END); }
    else if(p==="today"){ ss=now; se=now; }
    else if(p==="yst"){ const d=new Date(now); d.setDate(d.getDate()-1); ss=d; se=d; }
    else if(p==="l7"){ const d=new Date(now); d.setDate(d.getDate()-6); ss=d; se=now; }
    else if(p==="l30"){ const d=new Date(now); d.setDate(d.getDate()-29); ss=d; se=now; }
    else if(p==="tm"){ ss=new Date(now.getFullYear(),now.getMonth(),1); se=now; }
    else if(p==="lm"){ ss=new Date(now.getFullYear(),now.getMonth()-1,1); se=new Date(now.getFullYear(),now.getMonth(),0); }
    hov=null; leftM=new Date(ss.getFullYear(),ss.getMonth(),1); draw();
  }
  function commitApply(){ applyCb(!ss?ALLWK.slice():weeksOverlapping(ss, se||ss)); closePop(); }
  function onClick(e){
    const pr=e.target.closest("[data-preset]"); if(pr){ setPreset(pr.dataset.preset); return; }
    const nv=e.target.closest("[data-nav]"); if(nv){ leftM=new Date(leftM.getFullYear(),leftM.getMonth()+(nv.dataset.nav==="prev"?-1:1),1); draw(); return; }
    const ac=e.target.closest("[data-act]"); if(ac){ ac.dataset.act==="apply"?commitApply():closePop(); return; }
    const cell=e.target.closest(".cd.hasdata"); if(!cell) return;
    if(ct) clearTimeout(ct); const day=parse(cell.dataset.date);
    ct=setTimeout(()=>{ ss=day; se=null; hov=null; draw(); ct=null; },230);
  }
  function onDbl(e){ const cell=e.target.closest(".cd.hasdata"); if(!cell) return;
    if(ct){ clearTimeout(ct); ct=null; } const day=parse(cell.dataset.date);
    if(ss){ if(dOnly(day)<dOnly(ss)){ se=ss; ss=day; } else se=day; } else { ss=day; se=day; }
    hov=null; draw();
  }
  function onOver(e){ const cell=e.target.closest(".cd.hasdata"); if(cell && ss && !se){ hov=parse(cell.dataset.date); draw(); } }
  function openPop(){ ss=null; se=null; hov=null; leftM=new Date(DATA_END.getFullYear(),DATA_END.getMonth()-1,1);
    pop=document.createElement("div"); pop.className="calpop"; host.appendChild(pop); btn.classList.add("on"); draw();
    pop.addEventListener("click",onClick); pop.addEventListener("dblclick",onDbl); pop.addEventListener("mouseover",onOver);
    setTimeout(()=>document.addEventListener("mousedown",outside,true),0);
  }
  function closePop(){ if(pop){ pop.remove(); pop=null; } btn.classList.remove("on"); document.removeEventListener("mousedown",outside,true); }
  function outside(e){ if(pop && !pop.contains(e.target) && !btn.contains(e.target)) closePop(); }
  btn.addEventListener("click",()=>{ pop?closePop():openPop(); });
}

// ---------- render ----------
function render(){
  const kpis=[["Momo Sales",lak(D.kpi.sales),"overall sales"],["Units Sold",num(D.kpi.units),"total quantity"],
    ["Momo Orders",num(D.kpi.orders),"total orders"],["Avg Order Value","₹"+D.kpi.aov,"order-bill basis"]]
    .map(k=>`<div class="kpi"><div class="klab">${k[0]}</div><div class="kval">${k[1]}</div><div class="kdelta flat">${k[2]}</div></div>`).join("");
  const html=`<div class="wrap">
    <header class="hdr"><div class="brand"><div class="mark">🥟</div>
      <div><h1>Momos Performance Dashboard</h1>
      <div class="sub">NutrioBox · 10 outlets · Sales = momo item total · Qty = item_quantity</div></div></div>
      <div class="period">${esc(PERIOD)}</div></header>
    <div class="kpis">${kpis}</div>
    <section class="card"><div class="chd"><div><h2>Weekly Momos Trend — Sales &amp; Quantity</h2>
      <p>Weekly momo sales (₹, bars) vs units sold (line). Weeks run Mon–Sun.</p></div>
      <div class="clegend"><span><i class="sw" style="background:${ACCENT}"></i>Sales (₹)</span><span><i class="swl" style="background:${LINE}"></i>Units</span></div></div>
      <div class="chartwrap">${trendSVG()}<div class="tt" id="tt"></div></div></section>
    <div class="row2">
      <section class="card">
        <div class="chd"><div><h2>Outlet-wise Momo Sales</h2><p>Veg vs Non-veg by outlet, ranked.</p></div>
          <div style="display:flex;gap:8px;align-items:center">${toggleHTML("outlet",mOutlet)}${calBadge("outlet",selOutlet)}</div></div>
        <div class="bars" id="obars">${outletBars(selOutlet,mOutlet)}</div>
        <div class="leg"><span><i style="background:${VEG}"></i>Veg</span><span><i style="background:${NONVEG}"></i>Non-veg</span></div></section>
      <section class="card">
        <div class="chd"><div><h2>Veg vs Non-veg</h2><p class="pd">Share of momo ${mVN==='units'?'units':'sales (₹)'}.</p></div>
          <div style="display:flex;gap:8px;align-items:center">${toggleHTML("vn",mVN)}${calBadge("vn",selVN)}</div></div>
        <div id="vnbox">${donut(selVN,mVN)}</div>
        <div class="chd" style="margin-top:22px"><div><h2>Variant mix</h2><p class="pd">By variant (₹), split veg / non-veg.</p></div>
          ${calBadge("vm",selVM)}</div>
        <div class="bars" id="vmbox">${variantMix(selVM)}</div></section>
    </div>
    <section class="card">
      <div class="chd"><div><h2><span class="dt" style="background:${NONVEG}"></span>Chicken (Non-veg) — Weekly Sales by Variant</h2>
        <p class="pd">${mNV==='units'?'Units':'Order-total sales (₹)'} per variant. Latest week highlighted.</p></div>${toggleHTML("nv",mNV)}</div>
      <div class="tblwrap"><table id="nvtbl">${variantTableBody("non",mNV)}</table></div></section>
    <section class="card">
      <div class="chd"><div><h2><span class="dt" style="background:${VEG}"></span>Veg — Weekly Sales by Variant</h2>
        <p class="pd">${mV==='units'?'Units':'Order-total sales (₹)'} per variant. Latest week highlighted.</p></div>${toggleHTML("v",mV)}</div>
      <div class="tblwrap"><table id="vtbl">${variantTableBody("veg",mV)}</table></div></section>
    <section class="card">
      <div class="chd"><div><h2>Outlet-wise Momo Sales — Veg vs Non-veg</h2><p class="pd">Total momo sales (₹) and units per outlet.</p></div>
        ${calBadge("otbl",selOtbl)}</div>
      <div class="tblwrap"><table id="otbl-t">${outletTableBody(selOtbl)}</table></div></section>
    <p class="note"><b>Data note.</b> Built from your momo CSV (Petpooja Order Summary Item, deduplicated). Momo sales = sum of momo item total; units = item_quantity; orders = distinct invoices with momos. Weeks are Mon–Sun. Totals: <b>${num(D.kpi.orders)} momo orders · ${num(D.kpi.units)} units · ${lak(D.kpi.sales)}</b> across 10 outlets.</p>
  </div>`;
  const app=document.getElementById("app"); app.innerHTML=html;

  // metric toggles
  app.querySelectorAll(".toggle").forEach(tg=>{ const scope=tg.dataset.scope;
    tg.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      const m=b.dataset.m;
      if(scope==="outlet") mOutlet=m; else if(scope==="vn") mVN=m; else if(scope==="nv") mNV=m; else if(scope==="v") mV=m;
      render();
    })); });

  // chart tooltips
  const cw=app.querySelector(".chartwrap");
  if(cw){ const tt=cw.querySelector("#tt");
    cw.querySelectorAll(".hit").forEach(r=>{
      r.addEventListener("mousemove",e=>{ const i=+r.dataset.i, cwr=cw.getBoundingClientRect(), rr=r.getBoundingClientRect();
        tt.style.left=(rr.left+rr.width/2-cwr.left)+"px"; tt.style.top=(e.clientY-cwr.top-14)+"px";
        tt.innerHTML=`<div class="ttw">${D.weekLabels[i]} · ${esc(D.weekSpans[i])}</div>`
          +`<span class="tls" style="background:${ACCENT}"></span>Sales: <b>${lak(D.weekly.sales[i])}</b><br>`
          +`<span class="tls" style="background:${LINE}"></span>Units: <b>${num(D.weekly.units[i])}</b>`;
        tt.style.opacity=1; });
      r.addEventListener("mouseleave",()=>{ tt.style.opacity=0; });
    });
  }

  // calendars (each independent; re-render on apply so everything stays consistent)
  setupCal("outlet", ()=>selOutlet, idxs=>{ selOutlet=idxs; render(); });
  setupCal("vn", ()=>selVN, idxs=>{ selVN=idxs; render(); });
  setupCal("vm", ()=>selVM, idxs=>{ selVM=idxs; render(); });
  setupCal("otbl", ()=>selOtbl, idxs=>{ selOtbl=idxs; render(); });
}
render();

</script>
</body>
</html>
