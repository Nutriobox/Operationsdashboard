<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NutrioBox Momos Dashboard — 1 Jun – 23 Aug 2026</title>
<style>
html,body{margin:0;padding:0}
.dash{--bg:#f4f6fb;--card:#ffffff;--line:#e6e9f1;--line2:#eef1f7;--ink:#0f172a;--txt:#334155;--muted:#6b7280;--accent:#4f46e5;--accent-soft:#eef2ff;background:var(--bg);min-height:100vh;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.dash .wrap{max-width:1160px;margin:0 auto;padding:34px 24px 76px}
.dash .hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.dash .brand{display:flex;align-items:center;gap:14px}
.dash .mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#eef2ff,#e0e7ff);display:flex;align-items:center;justify-content:center;font-size:25px;border:1px solid #e0e7ff;flex-shrink:0}
.dash h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px;color:var(--ink)}
.dash .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.dash .period{font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid #dfe3fb;border-radius:999px;padding:8px 15px;white-space:nowrap}
.dash .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 4px}
.dash .kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 18px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.dash .kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.dash .kpi:nth-child(1)::before{background:#6366f1}
.dash .kpi:nth-child(2)::before{background:#0ea5e9}
.dash .kpi:nth-child(3)::before{background:#16a34a}
.dash .kpi:nth-child(4)::before{background:#f59e0b}
.dash .klab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.dash .kval{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.5px;color:var(--ink)}
.dash .kdelta{font-size:11.5px;margin-top:5px;color:var(--muted)}
.dash .kdelta.flat{color:var(--muted)}
.dash .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:16px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.dash .card h2{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.dash .card p,.dash .pd{color:var(--muted);font-size:12.5px;margin:4px 0 14px}
.dash .chd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.dash .chd h2{margin:0}
.dash .chd>div:first-child{flex:1}
.dash .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;margin-top:16px}
.dash .row2 .card{margin-top:0;min-width:0}
.dash .blab{fill:var(--ink);font-size:12px;font-weight:700}
.dash .xlab{fill:var(--ink);font-size:12px;font-weight:600}
.dash .xsub{fill:var(--muted);font-size:10px}
.dash .xunit{fill:#b45309;font-size:10.5px;font-weight:700}
.dash .axl{fill:#94a3b8;font-size:9.5px}
.dash .axr{fill:#c2830c;font-size:9.5px}
.dash .axttlL{fill:#6366f1;font-size:10px;font-weight:600}
.dash .axttlR{fill:#c2830c;font-size:10px;font-weight:600}
.dash .chartwrap{position:relative}
.dash .hit{cursor:pointer}
.dash svg .hit:hover{fill:rgba(99,102,241,.06)}
.dash .tt{position:absolute;pointer-events:none;opacity:0;transition:opacity .08s ease;background:#0f172a;color:#fff;font-size:11px;line-height:1.4;padding:7px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(2,6,23,.28);white-space:nowrap;z-index:5;transform:translate(-50%,-100%)}
.dash .tt .ttw{font-weight:700;margin-bottom:2px;font-size:11px}
.dash .tt .tls{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.dash .clegend{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--muted);flex-shrink:0}
.dash .clegend span{display:inline-flex;align-items:center;gap:7px}
.dash .clegend .sw{width:11px;height:11px;border-radius:3px}
.dash .clegend .swl{width:16px;height:3px;border-radius:2px}
.dash .toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f8fafc;flex-shrink:0}
.dash .toggle button{border:0;background:transparent;color:var(--muted);padding:6px 13px;font-size:12px;cursor:pointer;font-weight:600}
.dash .toggle button.on{background:var(--accent);color:#fff}
.dash .bars{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.dash .brow{display:flex;align-items:center;gap:12px}
.dash .bname{width:118px;font-size:12.5px;color:var(--txt);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash .btrack{flex:1;background:#eff2f8;border-radius:6px;overflow:hidden}
.dash .bfill{display:flex;height:20px;border-radius:6px;overflow:hidden;min-width:2px}
.dash .bfill>div{height:100%}
.dash .bval{width:76px;text-align:right;font-size:12.5px;font-weight:700;color:var(--ink);flex-shrink:0}
.dash .leg,.dash .vnrow{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:12px;align-items:center}
.dash .leg span,.dash .vnrow span{display:inline-flex;align-items:center;gap:6px}
.dash .leg i,.dash .vnrow i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dash .vnrow{justify-content:space-between;margin-top:9px;padding:3px 0;border-bottom:1px solid var(--line2)}
.dash .vnrow:last-of-type{border-bottom:0}
.dash .vnrow b{color:var(--ink)}
.dash .donutBig{fill:var(--ink);font-size:19px;font-weight:700}
.dash .donutSub{fill:var(--muted);font-size:10px}
.dash .tblwrap{overflow-x:auto;margin:0 -6px}
.dash table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.dash th,.dash td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
.dash th:first-child,.dash td:first-child{text-align:left;color:var(--txt)}
.dash thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.dash tbody tr:hover{background:#f9fafd}
.dash tr.tot td{font-weight:700;color:var(--ink);border-top:1.5px solid var(--line);border-bottom:0;background:#f7f9fc}
.dash .wk5{background:rgba(99,102,241,.09)}
.dash .dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
.dash .note{color:var(--muted);font-size:11.5px;margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.dash .note b{color:var(--txt)}
@media(max-width:820px){.dash .kpis{grid-template-columns:repeat(2,1fr)}.dash .row2{grid-template-columns:1fr}.dash .wrap{padding:24px 16px 60px}}

</style>
</head>
<body>
<!--
  ============================================================================
  NUTRIOBOX MOMOS DASHBOARD  —  standalone, self-contained (no build, no CDN).
  To update each week: edit ONLY the `const D = { ... }` object in the script
  below, then re-upload this single .html file to the website. Nothing else.
  Append the new week to: weekLabels, weekSpans, weekly.sales, weekly.units,
  and each row of tblNonveg / tblVeg. Add the week's numbers into: kpi (recompute
  aov = round(sales/orders)), every outlets.* array, and variantSplit.*.
  Update the "period" text (const PERIOD) to the new end date. The newest week is
  highlighted automatically (LAST = last index).
  ============================================================================
-->
<div id="app" class="dash"></div>
<script>

const D = {"weekLabels":["Wk1","Wk2","Wk3","Wk4","Wk5","Wk6","Wk7","Wk8","Wk9","Wk10","Wk11","Wk12"],"weekSpans":["Jun 1–7","Jun 8–14","Jun 15–21","Jun 22–28","Jun 29–Jul 5","Jul 6–12","Jul 13–19","Jul 20–26","Jul 27–Aug 2","Aug 3–9","Aug 10–16","Aug 17–23"],"kpi":{"sales":8364429,"units":21143,"orders":18658,"aov":448,"vegSales":3989154,"nonvegSales":4375275},"weekly":{"sales":[650554,672545,665094,657271,701783,676935,708792,732542,714708,694349,719826,770030],"units":[1340,1323,1287,1286,1412,1340,1477,2361,2299,2239,2306,2473]},"outlets":{"names":["Prashant Vihar","Dwarka","Karkardooma","Janakpuri","Rajinder Nagar","DLF Phase 2","Shivalik","Noida","Sector 63 Noida","Sector 15, Gurugram"],"sales":[1227872,1088356,1075022,996057,919894,747551,751839,657259,480843,419736],"units":[3035,2652,2668,2466,2341,1863,1871,1703,1359,1185],"vegSales":[692562,483421,540517,441718,389723,355548,305521,341708,206286,232150],"nonvegSales":[535310,604935,534505,554339,530171,392003,446318,315551,274557,187586],"vegUnits":[1749,1178,1337,1095,1032,883,775,920,571,645],"nonvegUnits":[1286,1474,1331,1371,1309,980,1096,783,788,540]},"variants":["Steamed","Tandoori","Chilli Sauce"],"variantSplit":{"vegSales":[3141351,671153,176650],"nonvegSales":[3425027,735210,215038]},"tblNonveg":{"Steamed":[289173,277470,282254,269745,304633,301092,284733,317089,278318,251554,276515,292451],"Tandoori":[54190,62080,52172,56745,69631,60501,72245,60902,69979,58180,49626,68959],"Chilli Sauce":[19359,17614,17501,16563,20111,16106,21753,18299,14859,17811,17601,17461]},"tblVeg":{"Steamed":[228921,238622,246731,250819,254224,239815,259207,267176,279488,282062,292554,301732],"Tandoori":[45486,62676,49864,55768,41008,52063,54634,54424,53728,65953,64717,70832],"Chilli Sauce":[13425,14083,16572,7631,12176,7358,16220,14652,18336,18789,18813,18595]}};
const PERIOD = "1 Jun – 23 Aug 2026";
const VEG="#16a34a", NONVEG="#dc2626", ACCENT="#6366f1", HL="#312e81", LINE="#f59e0b";
const LAST = D.weekLabels.length - 1;               // newest week always highlighted
const capEnd = PERIOD.split("–")[1].trim().replace(/\s*20\d\d$/,""); // e.g. "9 Aug"

function grp(n){ n=Math.round(n); let s=Math.abs(n).toString(); let l3=s.slice(-3), r=s.slice(0,-3);
  if(r) l3=","+l3; r=r.replace(/\B(?=(\d{2})+(?!\d))/g,","); return (n<0?"-":"")+r+l3; }
const inr=n=>"₹"+grp(n), lak=n=>"₹"+(n/100000).toFixed(2)+"L", num=n=>grp(n);
const sum=a=>a.reduce((x,y)=>x+y,0);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

let metric="sales";

function trendSVG(){
  const salesMax=Math.max(...D.weekly.sales), unitsMax=Math.max(...D.weekly.units), GN=5;
  const salesTop=Math.ceil((salesMax*1.08)/500000)*500000, unitsTop=Math.ceil(unitsMax/500)*500;
  const R0=702,L0=58,T0=26,B0=244,PW=760,PH=300;
  const band=(R0-L0)/D.weekLabels.length, barW=Math.min(38,band*0.42);
  const yS=v=>B0-(v/salesTop)*(B0-T0), yU=v=>B0-(v/unitsTop)*(B0-T0), cx=i=>L0+band*i+band/2;
  let g="";
  for(let k=0;k<=GN;k++){ const gy=B0-(k/GN)*(B0-T0);
    g+=`<line x1="${L0}" y1="${gy}" x2="${R0}" y2="${gy}" stroke="${k===0?'#cbd5e1':'#eef1f7'}"/>`
      +`<text x="${L0-9}" y="${gy+3.5}" text-anchor="end" class="axl">₹${salesTop*k/GN/100000}L</text>`
      +`<text x="${R0+9}" y="${gy+3.5}" text-anchor="start" class="axr">${num(unitsTop*k/GN)}</text>`; }
  let bars="";
  D.weekLabels.forEach((lab,i)=>{ const yv=yS(D.weekly.sales[i]);
    bars+=`<rect x="${cx(i)-barW/2}" y="${yv}" width="${barW}" height="${B0-yv}" rx="4" fill="${i===LAST?HL:ACCENT}"/>`
       +`<text x="${cx(i)}" y="${yv-9}" text-anchor="middle" class="blab">${lak(D.weekly.sales[i])}</text>`
       +`<text x="${cx(i)}" y="${B0+20}" text-anchor="middle" class="xlab">${lab}</text>`
       +`<text x="${cx(i)}" y="${B0+35}" text-anchor="middle" class="xsub">${esc(D.weekSpans[i])}</text>`; });
  const pts=D.weekly.units.map((u,i)=>`${cx(i)},${yU(u)}`).join(" ");
  let dots=""; D.weekly.units.forEach((u,i)=>{ dots+=`<circle cx="${cx(i)}" cy="${yU(u)}" r="${i===LAST?5:3.5}" fill="${LINE}" stroke="#fff" stroke-width="1.5"/>`; });
  const midY=(T0+B0)/2;
  const titles=`<text x="16" y="${midY}" text-anchor="middle" transform="rotate(-90 16 ${midY})" class="axttlL">Sales (₹)</text>`
    +`<text x="${R0+40}" y="${midY}" text-anchor="middle" transform="rotate(90 ${R0+40} ${midY})" class="axttlR">Units sold</text>`;
  let hit=""; D.weekLabels.forEach((lab,i)=>{ hit+=`<rect class="hit" x="${L0+band*i}" y="${T0}" width="${band}" height="${B0-T0}" fill="transparent" data-i="${i}"/>`; });
  return `<svg viewBox="0 0 ${PW} ${PH}" width="100%" role="img" style="display:block">${g}${titles}${bars}`
    +`<polyline points="${pts}" fill="none" stroke="${LINE}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${hit}</svg>`;
}

function outletBars(){
  const oVeg=metric==="sales"?D.outlets.vegSales:D.outlets.vegUnits;
  const oNon=metric==="sales"?D.outlets.nonvegSales:D.outlets.nonvegUnits;
  const oRow=D.outlets.names.map((_,i)=>oVeg[i]+oNon[i]); const oMax=Math.max(...oRow);
  return D.outlets.names.map((nm,i)=>`<div class="brow"><div class="bname">${esc(nm)}</div>`
    +`<div class="btrack"><div class="bfill" style="width:${oRow[i]/oMax*100}%">`
    +`<div style="width:${oVeg[i]/oRow[i]*100}%;background:${VEG}"></div>`
    +`<div style="width:${oNon[i]/oRow[i]*100}%;background:${NONVEG}"></div></div></div>`
    +`<div class="bval">${metric==="sales"?lak(oRow[i]):num(oRow[i])}</div></div>`).join("");
}

function variantMix(){
  const varTot=D.variants.map((_,i)=>D.variantSplit.vegSales[i]+D.variantSplit.nonvegSales[i]);
  const varMax=Math.max(...varTot);
  return D.variants.map((v,i)=>{ const t=varTot[i];
    return `<div class="brow"><div class="bname" style="width:92px">${esc(v)}</div>`
      +`<div class="btrack"><div class="bfill" style="width:${t/varMax*100}%">`
      +`<div style="width:${D.variantSplit.vegSales[i]/t*100}%;background:${VEG}"></div>`
      +`<div style="width:${D.variantSplit.nonvegSales[i]/t*100}%;background:${NONVEG}"></div></div></div>`
      +`<div class="bval">${lak(t)}</div></div>`; }).join("");
}

function donut(){
  const vegPct=D.kpi.vegSales/D.kpi.sales*100, DC=2*Math.PI*64, vegLen=D.kpi.vegSales/D.kpi.sales*DC;
  return `<svg viewBox="0 0 180 180" width="176" height="176" role="img" style="display:block;margin:6px auto 2px">`
    +`<g transform="rotate(-90 90 90)"><circle cx="90" cy="90" r="64" fill="none" stroke="#eef2f6" stroke-width="24"/>`
    +`<circle cx="90" cy="90" r="64" fill="none" stroke="${VEG}" stroke-width="24" stroke-dasharray="${vegLen} ${DC-vegLen}"/>`
    +`<circle cx="90" cy="90" r="64" fill="none" stroke="${NONVEG}" stroke-width="24" stroke-dasharray="${DC-vegLen} ${vegLen}" stroke-dashoffset="${-vegLen}"/></g>`
    +`<text x="90" y="86" text-anchor="middle" class="donutBig">${lak(D.kpi.sales)}</text>`
    +`<text x="90" y="105" text-anchor="middle" class="donutSub">momo sales</text></svg>`
    +`<div class="vnrow"><span><i style="background:${VEG}"></i>Veg</span><b>${lak(D.kpi.vegSales)} · ${vegPct.toFixed(1)}%</b></div>`
    +`<div class="vnrow"><span><i style="background:${NONVEG}"></i>Non-veg</span><b>${lak(D.kpi.nonvegSales)} · ${(100-vegPct).toFixed(1)}%</b></div>`;
}

function variantTable(title,dot,tbl){
  const colTot=D.weekLabels.map(()=>0); D.variants.forEach(v=>tbl[v].forEach((x,i)=>colTot[i]+=x));
  const head=`<tr><th>Variant</th>${D.weekLabels.map((w,i)=>`<th class="${i===LAST?'wk5':''}">${w}</th>`).join("")}<th>Total</th></tr>`;
  const rows=D.variants.map(v=>`<tr><td>${esc(v)}</td>${tbl[v].map((x,i)=>`<td class="${i===LAST?'wk5':''}">${inr(x)}</td>`).join("")}<td>${inr(sum(tbl[v]))}</td></tr>`).join("");
  const tot=`<tr class="tot"><td>Total</td>${colTot.map((x,i)=>`<td class="${i===LAST?'wk5':''}">${inr(x)}</td>`).join("")}<td>${inr(sum(colTot))}</td></tr>`;
  return `<section class="card"><h2><span class="dt" style="background:${dot}"></span>${esc(title)}</h2>`
    +`<p class="pd">Order-total sales (₹). Latest week highlighted.</p>`
    +`<div class="tblwrap"><table><thead>${head}</thead><tbody>${rows}${tot}</tbody></table></div></section>`;
}

function outletTable(){
  const rows=D.outlets.names.map((nm,i)=>`<tr><td>${esc(nm)}</td><td>${inr(D.outlets.vegSales[i])}</td><td>${inr(D.outlets.nonvegSales[i])}</td><td><b>${inr(D.outlets.sales[i])}</b></td><td>${num(D.outlets.units[i])}</td></tr>`).join("");
  const tot=`<tr class="tot"><td>Total</td><td>${inr(sum(D.outlets.vegSales))}</td><td>${inr(sum(D.outlets.nonvegSales))}</td><td>${inr(D.kpi.sales)}</td><td>${num(D.kpi.units)}</td></tr>`;
  return `<section class="card"><h2>Outlet-wise Momo Sales — Veg vs Non-veg</h2>`
    +`<p class="pd">Total momo sales (₹) and units per outlet, ${esc(PERIOD.replace(/\s*20\d\d$/,""))}.</p>`
    +`<div class="tblwrap"><table><thead><tr><th>Outlet</th><th>Veg ₹</th><th>Non-veg ₹</th><th>Total ₹</th><th>Units</th></tr></thead>`
    +`<tbody>${rows}${tot}</tbody></table></div></section>`;
}

function render(){
  const kpis=[["Momo Sales",lak(D.kpi.sales),"overall sales"],["Units Sold",num(D.kpi.units),"total quantity"],
    ["Momo Orders",num(D.kpi.orders),"total orders"],["Avg Order Value","₹"+D.kpi.aov,"order-bill basis"]]
    .map(k=>`<div class="kpi"><div class="klab">${k[0]}</div><div class="kval">${k[1]}</div><div class="kdelta flat">${k[2]}</div></div>`).join("");
  const html=`<div class="wrap">
    <header class="hdr"><div class="brand"><div class="mark">🥟</div>
      <div><h1>Momos Performance Dashboard</h1>
      <div class="sub">NutrioBox · 10 outlets · Sales = order-bill total (dedup by invoice) · Qty = item_quantity</div></div></div>
      <div class="period">${esc(PERIOD)}</div></header>
    <div class="kpis">${kpis}</div>
    <section class="card"><div class="chd"><div><h2>Weekly Momos Trend — Sales &amp; Quantity</h2>
      <p>Weekly momo sales (₹, bars) vs units sold (line). Weeks run Mon–Sun.</p></div>
      <div class="clegend"><span><i class="sw" style="background:${ACCENT}"></i>Sales (₹)</span><span><i class="swl" style="background:${LINE}"></i>Units</span></div></div>
      <div class="chartwrap">${trendSVG()}<div class="tt" id="tt"></div></div></section>
    <div class="row2">
      <section class="card"><div class="chd"><div><h2>Outlet-wise Momo Sales</h2><p>Veg vs Non-veg by outlet, ranked.</p></div>
        <div class="toggle"><button data-m="sales" class="${metric==='sales'?'on':''}">₹ Sales</button><button data-m="units" class="${metric==='units'?'on':''}">Units</button></div></div>
        <div class="bars" id="obars">${outletBars()}</div>
        <div class="leg"><span><i style="background:${VEG}"></i>Veg</span><span><i style="background:${NONVEG}"></i>Non-veg</span></div></section>
      <section class="card"><h2>Veg vs Non-veg</h2><p class="pd">Share of momo sales (₹), ${esc(capEnd)} window.</p>
        ${donut()}
        <h2 style="margin-top:22px">Variant mix</h2><p class="pd">By variant (₹), split veg / non-veg.</p>
        <div class="bars">${variantMix()}</div></section>
    </div>
    ${variantTable("Chicken (Non-veg) — Weekly Sales by Variant",NONVEG,D.tblNonveg)}
    ${variantTable("Veg — Weekly Sales by Variant",VEG,D.tblVeg)}
    ${outletTable()}
    <p class="note"><b>Data note.</b> Built from your momo CSV (one row per invoice, deduplicated). Momo sales = order bill total per invoice; units = item_quantity. Weeks are Mon–Sun. Totals: <b>${num(D.kpi.orders)} momo orders · ${num(D.kpi.units)} units · ${lak(D.kpi.sales)}</b> across 10 outlets.</p>
  </div>`;
  const app=document.getElementById("app"); app.innerHTML=html;
  app.querySelectorAll(".toggle button").forEach(b=>b.addEventListener("click",()=>{ metric=b.dataset.m; render(); }));
  const cw=app.querySelector(".chartwrap");
  if(cw){ const tt=cw.querySelector("#tt");
    cw.querySelectorAll(".hit").forEach(r=>{
      r.addEventListener("mousemove",e=>{
        const i=+r.dataset.i, cwr=cw.getBoundingClientRect(), rr=r.getBoundingClientRect();
        tt.style.left=(rr.left+rr.width/2-cwr.left)+"px";
        tt.style.top=(e.clientY-cwr.top-14)+"px";
        tt.innerHTML=`<div class="ttw">${D.weekLabels[i]} · ${esc(D.weekSpans[i])}</div>`
          +`<span class="tls" style="background:${ACCENT}"></span>Sales: <b>${lak(D.weekly.sales[i])}</b><br>`
          +`<span class="tls" style="background:${LINE}"></span>Units: <b>${num(D.weekly.units[i])}</b>`;
        tt.style.opacity=1;
      });
      r.addEventListener("mouseleave",()=>{ tt.style.opacity=0; });
    });
  }
}
render();

</script>
</body>
</html>
